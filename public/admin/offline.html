<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Pooja Admin</title>
<style>
  :root { color-scheme: light only; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: #ffffff;
    color: #1a1a1a;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .card { max-width: 320px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #55524d; }
  button {
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid #d8d3c8;
    border-radius: 6px;
    background: #1a1a1a;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>Pooja Admin needs the internet for every page — nothing here is stored for offline use, on purpose, since orders, stock and prices all have to be current. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
